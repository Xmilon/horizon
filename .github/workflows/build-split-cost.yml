name: Build split cost (temporary fork benchmark)
on:
  push:
    branches: [bench/5446-build-split]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUST_MIN_STACK: '33554432'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/bench-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare both revisions on this runner
        run: |
          cp tools/build_split_cost.py /tmp/build_split_cost.py
          python3 /tmp/build_split_cost.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-split-cost
          path: |
            build-split-cost.json
            build-split-*.log
